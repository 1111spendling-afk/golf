name: Masterlist / Friendslist


run-name: >-
  ${{ github.event_name == 'schedule'
    && 'Masterlist Friendslist Abgleich (automatisch)'
    || inputs.mode == 'compare'
    && 'Friendslist Vergleich'
    || inputs.mode == 'add_missing'
    && 'Masterlist Friendslist Hinzufügen'
    || inputs.mode == 'add_one'
    && 'Masterlist Friendslist Test-Hinzufügen'
    || inputs.mode == 'whi'
    && 'Masterlist WHI-Abgleich'
    || 'Masterlist Friendslist Diagnose' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Vorgang"
        required: true
        default: compare
        type: choice
        options:
          - compare
          - add_one
          - add_missing
          - whi
          - diagnose
  schedule:
    # Der automatische Cron bleibt ausschließlich der offizielle WHI-Abgleich.
    - cron: "0 8,9 * * *"
    - cron: "0 22,23 * * *"


permissions:
  contents: read


concurrency:
  group: mga-oegv-sync
  cancel-in-progress: false


jobs:
  sync:
    name: MGA ÖGV Friendslist
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Österreichische Zeit und Vorgang bestimmen
        id: local_time
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          local_time="$(TZ=Europe/Vienna date +%H:%M)"
          local_offset="$(TZ=Europe/Vienna date +%z)"
          local_iso="$(TZ=Europe/Vienna date --iso-8601=seconds)"
          echo "Österreichische Zeit: $local_time (UTC$local_offset)"
          echo "Österreichischer Zeitstempel: $local_iso"
          echo "Österreichischer Zeitstempel: $local_iso" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub-Auslöser: $EVENT_NAME | Zeitplan: $SCHEDULE"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manueller Vorgang: $DISPATCH_MODE"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
            echo "sync_mode=${DISPATCH_MODE:-compare}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "0 8,9 * * *")
              if [ "$local_time" = "10:00" ]; then echo "run_sync=true" >> "$GITHUB_OUTPUT"; else echo "run_sync=false" >> "$GITHUB_OUTPUT"; fi
              ;;
            "0 22,23 * * *")
              if [ "$local_time" = "00:00" ]; then echo "run_sync=true" >> "$GITHUB_OUTPUT"; else echo "run_sync=false" >> "$GITHUB_OUTPUT"; fi
              ;;
            *)
              echo "run_sync=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "sync_mode=whi" >> "$GITHUB_OUTPUT"
      - name: Abgleichcode laden
        if: steps.local_time.outputs.run_sync == 'true'
        uses: actions/checkout@v4


      - name: Python einrichten
        if: steps.local_time.outputs.run_sync == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Browser-Automatisierung installieren
        if: steps.local_time.outputs.run_sync == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r oegv-sync/requirements.txt
          python -m playwright install --with-deps chromium
      - name: ÖGV Friendslist Vorgang ausführen
        if: steps.local_time.outputs.run_sync == 'true'
        env:
          OEGV_USER: ${{ secrets.OEGV_USER }}
          OEGV_PASSWORD: ${{ secrets.OEGV_PASSWORD }}
          OEGV_MODE: ${{ steps.local_time.outputs.sync_mode }}
          OEGV_DIAGNOSTIC: ${{ steps.local_time.outputs.sync_mode == 'diagnose' && '1' || '0' }}
          MGA_SYNC_URL: https://mga-turnieranmeldung.bonso1.chatgpt.site/api/admin/masterliste/oegv-sync
          MGA_SYNC_TOKEN: ${{ secrets.MGA_SYNC_TOKEN }}
          MGA_SITE_BYPASS_TOKEN: ${{ secrets.MGA_SITE_BYPASS_TOKEN }}
        run: python oegv-sync/sync.py


      - name: Diagnose-Screenshots als Artifact speichern
        if: always() && steps.local_time.outputs.run_sync == 'true' && steps.local_time.outputs.sync_mode == 'diagnose'
        uses: actions/upload-artifact@v4
        with:
          name: oegv-diagnose-${{ github.run_number }}
          path: diagnostic-screenshots/
          if-no-files-found: warn
          retention-days: 7
