name: MGA ÖGV-Friendslist-Abgleich

on:
  workflow_dispatch:
  schedule:
    # Sommerzeit: 09:30 / 21:30 Österreich
    - cron: "30 7,19 * * *"
    # Winterzeit: 09:30 / 21:30 Österreich
    - cron: "30 8,20 * * *"
    # Einmaliger Test: 10:40 Österreichische Sommerzeit – danach entfernen
    - cron: "40 8 * * *"

permissions:
  contents: read

concurrency:
  group: mga-oegv-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Friendslist mit MGA Masterliste abgleichen
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Auf österreichische Zeit prüfen
        id: local_time
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          local_time="$(TZ=Europe/Vienna date +%H:%M)"
          local_offset="$(TZ=Europe/Vienna date +%z)"
          echo "Österreichische Zeit: $local_time (UTC$local_offset)"
          echo "GitHub-Auslöser: $EVENT_NAME | Zeitplan: $SCHEDULE"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manueller Lauf: Abgleich wird ausgeführt."
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$SCHEDULE" in
            "30 7,19 * * *")
              [ "$local_offset" = "+0200" ] && echo "run_sync=true" >> "$GITHUB_OUTPUT" || echo "run_sync=false" >> "$GITHUB_OUTPUT"
              ;;
            "30 8,20 * * *")
              [ "$local_offset" = "+0100" ] && echo "run_sync=true" >> "$GITHUB_OUTPUT" || echo "run_sync=false" >> "$GITHUB_OUTPUT"
              ;;
            "40 8 * * *")
              echo "Testlauf: Abgleich wird ausgeführt."
              echo "run_sync=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Kein vorgesehener Abgleichtermin."
              echo "run_sync=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Abgleichcode laden
        if: steps.local_time.outputs.run_sync == 'true'
        uses: actions/checkout@v4

      - name: Python einrichten
        if: steps.local_time.outputs.run_sync == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser-Automatisierung installieren
        if: steps.local_time.outputs.run_sync == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r oegv-sync/requirements.txt
          python -m playwright install --with-deps chromium

      - name: ÖGV Friendslist abgleichen
        if: steps.local_time.outputs.run_sync == 'true'
        env:
          OEGV_USER: ${{ secrets.OEGV_USER }}
          OEGV_PASSWORD: ${{ secrets.OEGV_PASSWORD }}
          MGA_SYNC_URL: https://mga-turnieranmeldung.bonso1.chatgpt.site/api/admin/masterliste/oegv-sync
          MGA_SYNC_TOKEN: ${{ secrets.MGA_SYNC_TOKEN }}
          MGA_SITE_BYPASS_TOKEN: ${{ secrets.MGA_SITE_BYPASS_TOKEN }}
        run: python oegv-sync/sync.py
